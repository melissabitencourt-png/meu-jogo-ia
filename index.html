
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Você decide o futuro da IA</title>
<style>
body {
  background: #0b1024;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 15px;
}
main {
  max-width: 700px;
  margin: 50px auto;
  background: #19233d;
  padding: 35px;
  border-radius: 20px;
}
h1 { color: #22d3ee; font-size: 38px; }
h2 { color: #22d3ee; }
p { font-size: 19px; line-height: 1.6; }
button {
  display: block;
  width: 100%;
  margin: 14px 0;
  padding: 17px;
  border: none;
  border-radius: 12px;
  background: #263957;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
button:hover { background: #087e9b; }
.principal { background: #22d3ee; color: #091326; }
</style>
</head>
<body>
<main id="jogo">
<h1>Você decide o futuro da IA</h1>
<p>Uma história interativa sobre tecnologia, escolhas e o futuro da humanidade.</p>
<button class="principal" onclick="iniciar()">COMEÇAR</button>
</main>

<script>
const nomes = ["Ana", "Sofia", "Lucas", "Gabriel", "Alice", "Miguel"];
let personagem = "";

const cenas = {
inicio: {
titulo: "Uma nova descoberta",
texto: "Você encontra uma inteligência artificial capaz de responder perguntas, criar imagens e ajudar pessoas. Qual será sua reação?",
opcoes: [
["Ficar encantado com a tecnologia", "encantado"],
["Ficar preocupado com os riscos", "preocupado"]
]
},
encantado: {
titulo: "Oportunidades incríveis",
texto: "Você começa a usar a IA para estudar e criar projetos. Mas percebe que algumas respostas podem estar erradas. O que fazer?",
opcoes: [
["Conferir as informações", "responsavel"],
["Confiar em tudo que ela diz", "dependencia"]
]
},
preocupado: {
titulo: "Os riscos da tecnologia",
texto: "Você percebe que a IA pode criar informações falsas e ameaçar a privacidade. Como agir?",
opcoes: [
["Defender regras de segurança", "responsavel"],
["Evitar qualquer contato com IA", "isolamento"]
]
},
responsavel: {
titulo: "Um futuro equilibrado",
texto: "Você aprende que a IA pode ajudar muito, desde que seja utilizada com ética, responsabilidade e pensamento crítico.",
opcoes: [
["Descobrir o final", "finalbom"]
]
},
dependencia: {
titulo: "Dependência tecnológica",
texto: "Ao confiar em todas as respostas, você percebe que deixou de verificar informações importantes. A tecnologia precisa de supervisão humana.",
opcoes: [
["Refletir sobre o futuro", "finalreflexao"]
]
},
isolamento: {
titulo: "Uma nova perspectiva",
texto: "Você percebe que ignorar completamente a tecnologia também significa perder oportunidades de aprendizagem e inovação.",
opcoes: [
["Refletir sobre o futuro", "finalreflexao"]
]
},
finalbom: {
titulo: "O futuro está em nossas mãos!",
texto: "Sua escolha ajudou a construir uma relação equilibrada entre humanidade e inteligência artificial.",
final: true
},
finalreflexao: {
titulo: "Toda escolha tem consequências!",
texto: "O futuro da IA depende das decisões humanas. Precisamos de conhecimento, ética e responsabilidade.",
final: true
}
};

function iniciar() {
personagem = nomes[Math.floor(Math.random() * nomes.length)];
mostrar("inicio");
}

function mostrar(id) {
const cena = cenas[id];
let html = `<h2>${cena.titulo}</h2>
<p>${cena.texto}</p>
<p>Personagem: <strong>${personagem}</strong></p>`;

if (cena.final) {
html += `<h2>💡 Pense e responda:</h2>
<p>Como você gostaria que a inteligência artificial fosse utilizada no futuro?</p>
<textarea id="resposta" placeholder="Escreva sua opinião..." style="width:90%;height:80px;padding:10px;border-radius:8px"></textarea>
<button onclick="reiniciar()">JOGAR NOVAMENTE</button>`;
} else {
cena.opcoes.forEach(opcao => {
html += `<button onclick="mostrar('${opcao[1]}')">${opcao[0]}</button>`;
});
}

document.getElementById("jogo").innerHTML = html;
}

function reiniciar() {
mostrar("inicio");
personagem = nomes[Math.floor(Math.random() * nomes.length)];
}
</script>
</body>
</html>
